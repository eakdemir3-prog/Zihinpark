name: Android Derleme

on:
  push:
    branches: [zihinpark-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Imza anahtarlari (gecici)
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Derle (APK)
        run: |
          set -o pipefail
          gradle --no-configuration-cache :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Birim testleri
        run: |
          set -o pipefail
          gradle --no-configuration-cache :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log

      - name: Hata ozeti (commit yorumu)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            cat build.log test.log 2>/dev/null | grep -E "^e: |error:|FAILED|What went wrong|Exception|expected|AssertionError|at com\.example" -A2 | head -c 60000
            echo '```'
          } > summary.md
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -A8 "<failure" "$f" | head -c 20000 >> summary.md || true
          done
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@summary.md > /dev/null

      - name: APK'yi sonraki is icin sakla
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Test raporlari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK on surum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ZihinPark-test.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/* \
            --target "${{ github.sha }}" --prerelease \
            --title "ZihinPark test build #${{ github.run_number }}" \
            --notes "Otomatik derleme (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})"

  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator ekran goruntuleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash .github/screens.sh
      - name: Goruntuleri dala yaz
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r shots/* /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q && git checkout -q -b ci-shots
          git config user.name ci && git config user.email ci@example.com
          echo "${{ github.sha }}" > SHA.txt
          git add -A && git commit -qm "shots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
