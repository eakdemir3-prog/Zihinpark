name: Gorsel Arac

on:
  push:
    branches: [zihinpark-v2]
    paths: ['.github/img/request.txt']

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Hazirla
        run: sudo apt-get install -y imagemagick jq > /dev/null
      - name: Islem
        run: |
          set -x
          mkdir -p out
          mode=$(head -1 .github/img/request.txt)
          if [ "$mode" = "sheets" ]; then
            mkdir -p th
            for p in $(seq 1 12); do
              curl -sfL "https://picsum.photos/v2/list?page=$p&limit=100" -o "l$p.json" || true
              jq -r '.[] | "\(.id) \(.width) \(.height) \(.author)"' "l$p.json" >> out/list.txt || true
            done
            cut -d' ' -f1 out/list.txt | xargs -P 16 -I{} sh -c 'curl -sfL "https://picsum.photos/id/{}/200/200" -o th/$(printf %04d {}).jpg || true'
            ls th | wc -l
            n=0
            ls th/*.jpg | split -l 64 - grp_
            for g in grp_*; do
              montage $(cat $g | sed 's#\(th/0*\([0-9][0-9]*\)\.jpg\)#-label \2 \1#') -tile 8x8 -geometry 180x180+3+3 -pointsize 22 -fill white -background '#111' out/sheet_$n.jpg
              n=$((n+1))
            done
          else
            # fetch: her satir "id"
            mkdir -p out/img
            tail -n +2 .github/img/request.txt | xargs -P 12 -I{} sh -c 'curl -sfL "https://picsum.photos/id/{}/720/720" -o out/img/{}.jpg || echo fail {}'
            curl -sfL "https://picsum.photos/v2/list?page=1&limit=100" > /dev/null
            for p in $(seq 1 12); do curl -sfL "https://picsum.photos/v2/list?page=$p&limit=100" | jq -r '.[] | "\(.id)\t\(.author)\t\(.url)"' >> out/authors.tsv || true; done
            ls out/img | wc -l
          fi
      - name: Yayinla
        run: |
          cd out
          git init -q -b img-out
          git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "img $(date +%s)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" img-out
